<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Wall & Floor Gradients -->
    <linearGradient id="wallGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBFBFB"/>
      <stop offset="100%" stop-color="#F1EFEA"/>
    </linearGradient>
    <linearGradient id="floorGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDE9E3"/>
      <stop offset="100%" stop-color="#DCD6CD"/>
    </linearGradient>

    <!-- Wood Frame Texture -->
    <linearGradient id="teakWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="50%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#6B3E11"/>
    </linearGradient>
    <linearGradient id="lightWoodArm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CD853F"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>

    <!-- Floral Pattern Definition -->
    <pattern id="floralPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#F8F8F8"/>
      <!-- Floral Lotus Motif -->
      <path d="M 40 20 Q 30 35 40 50 Q 50 35 40 20 Z" fill="#222"/>
      <path d="M 40 50 Q 20 40 10 30 Q 25 25 40 50 Z" fill="#444"/>
      <path d="M 40 50 Q 60 40 70 30 Q 55 25 40 50 Z" fill="#444"/>
      <circle cx="40" cy="50" r="5" fill="#888"/>
      <!-- Border outline -->
      <rect x="2" y="2" width="76" height="76" fill="none" stroke="#BBB" stroke-width="1.5" rx="6"/>
    </pattern>

    <!-- Brown Floor Rug Gradient -->
    <linearGradient id="brownRug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5C4033"/>
      <stop offset="50%" stop-color="#3D2B1F"/>
      <stop offset="100%" stop-color="#241911"/>
    </linearGradient>

    <!-- Glass Table Top -->
    <linearGradient id="darkGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B2B2B"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>

    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Wall -->
  <rect x="0" y="0" width="1200" height="480" fill="url(#wallGrad3)"/>

  <!-- Tiled Floor -->
  <rect x="0" y="480" width="1200" height="320" fill="url(#floorGrad3)"/>
  <path d="M 0 560 L 1200 560 M 0 660 L 1200 660 M 0 750 L 1200 750" stroke="#DDD" stroke-width="1.2"/>
  <path d="M 280 480 L 160 800 M 620 480 L 580 800 M 960 480 L 1000 800" stroke="#DDD" stroke-width="1.2"/>

  <!-- BROWN & WHITE ABSTRACT DECORATIVE FLOOR CARPET / RUG -->
  <g filter="url(#shadow3)">
    <polygon points="120,530 1080,530 1160,780 40,780" fill="url(#brownRug)"/>
    <!-- Abstract Rug Lines -->
    <path d="M 80,750 C 300,600 500,720 700,580 C 900,700 1050,550 1120,760" stroke="#F8F5EF" stroke-width="12" fill="none" opacity="0.8"/>
    <path d="M 120,700 C 350,550 550,680 750,540" stroke="#F8F5EF" stroke-width="8" fill="none" opacity="0.6"/>
  </g>

  <!-- MAIN 3-SEATER WOODEN FLORAL SOFA (CENTER-BACK) -->
  <g filter="url(#shadow3)">
    <ellipse cx="500" cy="540" rx="270" ry="18" fill="#000" opacity="0.25"/>

    <!-- Wooden Legs & Base Frame -->
    <rect x="250" y="480" width="24" height="60" rx="4" fill="url(#teakWood)"/>
    <rect x="730" y="480" width="24" height="60" rx="4" fill="url(#teakWood)"/>
    <rect x="490" y="480" width="20" height="60" rx="4" fill="url(#teakWood)"/>
    <rect x="230" y="450" width="540" height="35" rx="6" fill="url(#teakWood)"/>

    <!-- Back Wooden Frame -->
    <rect x="220" y="180" width="560" height="280" rx="14" fill="url(#teakWood)"/>

    <!-- 3 Back Cushions with Floral Slip Covers -->
    <!-- Cushion 1 -->
    <rect x="240" y="200" width="160" height="240" rx="12" fill="url(#floralPattern)" stroke="#666" stroke-width="2"/>
    <!-- Cushion 2 -->
    <rect x="420" y="200" width="160" height="240" rx="12" fill="url(#floralPattern)" stroke="#666" stroke-width="2"/>
    <!-- Cushion 3 -->
    <rect x="600" y="200" width="160" height="240" rx="12" fill="url(#floralPattern)" stroke="#666" stroke-width="2"/>

    <!-- 3 Seat Cushions with Floral Covers -->
    <rect x="240" y="420" width="160" height="80" rx="10" fill="url(#floralPattern)" stroke="#666" stroke-width="2"/>
    <rect x="420" y="420" width="160" height="80" rx="10" fill="url(#floralPattern)" stroke="#666" stroke-width="2"/>
    <rect x="600" y="420" width="160" height="80" rx="10" fill="url(#floralPattern)" stroke="#666" stroke-width="2"/>

    <!-- Left Wooden Sculpted Armrest -->
    <rect x="190" y="320" width="45" height="170" rx="12" fill="url(#lightWoodArm)"/>
    <!-- Right Wooden Sculpted Armrest -->
    <rect x="765" y="320" width="45" height="170" rx="12" fill="url(#lightWoodArm)"/>
  </g>

  <!-- LEFT WOODEN FLORAL ARMCHAIR (FOREGROUND-LEFT) -->
  <g filter="url(#shadow3)">
    <ellipse cx="180" cy="710" rx="150" ry="22" fill="#000" opacity="0.3"/>
    <!-- Wooden Frame -->
    <rect x="20" y="440" width="300" height="260" rx="14" fill="url(#teakWood)"/>
    <!-- Back Cushion -->
    <rect x="50" y="220" width="240" height="260" rx="12" fill="url(#floralPattern)" stroke="#555" stroke-width="2"/>
    <!-- Seat Cushion -->
    <rect x="40" y="450" width="260" height="210" rx="12" fill="url(#floralPattern)" stroke="#555" stroke-width="2"/>
    <!-- Sculpted Armrests -->
    <rect x="0" y="340" width="45" height="280" rx="14" fill="url(#lightWoodArm)"/>
    <rect x="295" y="340" width="45" height="280" rx="14" fill="url(#lightWoodArm)"/>
  </g>

  <!-- RIGHT WOODEN FLORAL ARMCHAIR (FOREGROUND-RIGHT) -->
  <g filter="url(#shadow3)">
    <ellipse cx="980" cy="690" rx="140" ry="20" fill="#000" opacity="0.3"/>
    <rect x="830" y="420" width="300" height="250" rx="14" fill="url(#teakWood)"/>
    <rect x="860" y="220" width="240" height="240" rx="12" fill="url(#floralPattern)" stroke="#555" stroke-width="2"/>
    <rect x="850" y="430" width="260" height="200" rx="12" fill="url(#floralPattern)" stroke="#555" stroke-width="2"/>
    <rect x="810" y="320" width="45" height="270" rx="14" fill="url(#lightWoodArm)"/>
    <rect x="1105" y="320" width="45" height="270" rx="14" fill="url(#lightWoodArm)"/>
  </g>

  <!-- DARK GLASS TOP WOODEN COFFEE TABLE -->
  <g filter="url(#shadow3)">
    <ellipse cx="550" cy="740" rx="200" ry="28" fill="#000" opacity="0.35"/>

    <!-- Wooden Frame Structure -->
    <rect x="340" y="520" width="420" height="190" rx="8" fill="url(#teakWood)"/>
    <!-- Grid Bottom Shelf -->
    <rect x="360" y="630" width="380" height="25" fill="#3D2314"/>
    <line x1="400" y1="630" x2="400" y2="655" stroke="#7A4822" stroke-width="4"/>
    <line x1="450" y1="630" x2="450" y2="655" stroke="#7A4822" stroke-width="4"/>
    <line x1="500" y1="630" x2="500" y2="655" stroke="#7A4822" stroke-width="4"/>
    <line x1="550" y1="630" x2="550" y2="655" stroke="#7A4822" stroke-width="4"/>
    <line x1="600" y1="630" x2="600" y2="655" stroke="#7A4822" stroke-width="4"/>
    <line x1="650" y1="630" x2="650" y2="655" stroke="#7A4822" stroke-width="4"/>
    <line x1="700" y1="630" x2="700" y2="655" stroke="#7A4822" stroke-width="4"/>

    <!-- Dark Glass Top Surface -->
    <rect x="320" y="500" width="460" height="35" rx="6" fill="url(#darkGlass)" stroke="#666" stroke-width="2"/>
    <rect x="330" y="503" width="440" height="6" rx="2" fill="#888" opacity="0.5"/>

    <!-- 2 TV Remotes & Room Key on Table -->
    <rect x="520" y="508" width="50" height="12" rx="3" fill="#111"/>
    <rect x="580" y="510" width="45" height="10" rx="2" fill="#222"/>
    <!-- Keyring -->
    <circle cx="650" cy="514" r="5" fill="#FFD700" stroke="#B8860B"/>
    <rect x="655" y="512" width="18" height="4" fill="#FFD700"/>
  </g>

  <!-- Title Badge Overlay -->
  <g>
    <rect x="30" y="30" width="500" height="52" rx="26" fill="rgba(10, 31, 23, 0.85)" stroke="#C9A66B" stroke-width="1.5"/>
    <text x="55" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="800" fill="#C9A66B">E2 HOMES RAIPUR</text>
    <text x="245" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">| Classic Floral Lounge Photo</text>
  </g>
</svg>
