<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bedWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F6F0"/>
      <stop offset="100%" stop-color="#EAE5DA"/>
    </linearGradient>
    <linearGradient id="bedWood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C3A21"/>
      <stop offset="100%" stop-color="#3A2211"/>
    </linearGradient>
    <linearGradient id="sheetWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0EFEA"/>
    </linearGradient>
    <linearGradient id="goldRunner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A66B"/>
      <stop offset="50%" stop-color="#E5C185"/>
      <stop offset="100%" stop-color="#A88344"/>
    </linearGradient>
    <filter id="shadowBed" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="500" fill="url(#bedWall)"/>
  
  <!-- Air Conditioner on Wall -->
  <rect x="800" y="60" width="280" height="80" rx="10" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <line x1="820" y1="120" x2="1060" y2="120" stroke="#CCC" stroke-width="2"/>
  <circle cx="1040" cy="90" r="4" fill="#25D366"/>

  <!-- Tiled Floor -->
  <rect x="0" y="500" width="1200" height="300" fill="#ECE7DF"/>
  <path d="M 0 600 L 1200 600 M 0 700 L 1200 700" stroke="#DDD" stroke-width="1.2"/>

  <!-- MASTER KING BEDROOM -->
  <g>
    <!-- Wooden Headboard -->
    <rect x="250" y="160" width="700" height="340" rx="16" fill="url(#bedWood)"/>
    
    <!-- Bed Base & Mattress -->
    <rect x="220" y="440" width="760" height="260" rx="20" fill="url(#sheetWhite)"/>
    
    <!-- Clean Pillows -->
    <rect x="280" y="380" width="280" height="110" rx="20" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
    <rect x="640" y="380" width="280" height="110" rx="20" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
    
    <!-- Accent Gold Bed Runner -->
    <rect x="220" y="580" width="760" height="80" fill="url(#goldRunner)"/>
  </g>

  <!-- Title Badge Overlay -->
  <g>
    <rect x="30" y="30" width="480" height="52" rx="26" fill="rgba(10, 31, 23, 0.85)" stroke="#C9A66B" stroke-width="1.5"/>
    <text x="55" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="800" fill="#C9A66B">E2 HOMES RAIPUR</text>
    <text x="245" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">| Master Suite Bedroom</text>
  </g>
</svg>
