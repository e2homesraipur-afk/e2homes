<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Wall & Floor Gradients -->
    <linearGradient id="wallGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFDFD"/>
      <stop offset="100%" stop-color="#F3F3F3"/>
    </linearGradient>
    <linearGradient id="floorGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFECE6"/>
      <stop offset="100%" stop-color="#DFD9CF"/>
    </linearGradient>

    <!-- Olive Velvet Gradients -->
    <linearGradient id="oliveVelvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#708238"/>
      <stop offset="50%" stop-color="#556B2F"/>
      <stop offset="100%" stop-color="#3B4E1A"/>
    </linearGradient>
    <linearGradient id="oliveCushion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#80963F"/>
      <stop offset="100%" stop-color="#4B5E28"/>
    </linearGradient>

    <!-- Gold Stripe Accent -->
    <linearGradient id="goldBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- Glass Table Reflection -->
    <linearGradient id="glassReflect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="50%" stop-color="rgba(200,230,220,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.5)"/>
    </linearGradient>

    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Off-white Wall -->
  <rect x="0" y="0" width="1200" height="480" fill="url(#wallGrad2)"/>

  <!-- Green Leaf Curtains in Background -->
  <g opacity="0.85">
    <!-- Left Curtain -->
    <rect x="680" y="20" width="120" height="460" fill="#E8F0E6"/>
    <path d="M 690 30 Q 710 120 690 220 Q 710 320 690 420" stroke="#4A6B32" stroke-width="8" fill="none"/>
    <path d="M 730 30 Q 750 120 730 220 Q 750 320 730 420" stroke="#7A9A5B" stroke-width="6" fill="none"/>
    <path d="M 760 30 Q 780 120 760 220 Q 780 320 760 420" stroke="#3B5323" stroke-width="7" fill="none"/>

    <!-- Right Window Curtain -->
    <rect x="880" y="20" width="140" height="460" fill="#E8F0E6"/>
    <path d="M 900 30 Q 920 120 900 220 Q 920 320 900 420" stroke="#4A6B32" stroke-width="8" fill="none"/>
    <path d="M 950 30 Q 970 120 950 220 Q 970 320 950 420" stroke="#7A9A5B" stroke-width="6" fill="none"/>
    <path d="M 990 30 Q 1010 120 990 220 Q 1010 320 990 420" stroke="#3B5323" stroke-width="7" fill="none"/>
  </g>

  <!-- Dining Table Setup in Right Background -->
  <g opacity="0.65">
    <rect x="1050" y="220" width="130" height="180" fill="#3D2314" rx="4"/>
    <rect x="1040" y="200" width="18" height="220" fill="#25140B"/>
    <rect x="1170" y="200" width="18" height="220" fill="#25140B"/>
  </g>

  <!-- Tiled Floor -->
  <rect x="0" y="480" width="1200" height="320" fill="url(#floorGrad2)"/>
  <path d="M 0 570 L 1200 570 M 0 670 L 1200 670 M 0 760 L 1200 760" stroke="#DDD" stroke-width="1.2"/>
  <path d="M 300 480 L 180 800 M 650 480 L 600 800 M 980 480 L 1020 800" stroke="#DDD" stroke-width="1.2"/>

  <!-- OLIVE GREEN 3-SEATER SOFA (CENTER-BACK) -->
  <g filter="url(#shadow2)">
    <ellipse cx="480" cy="560" rx="280" ry="20" fill="#000" opacity="0.2"/>

    <!-- Main Backrest -->
    <rect x="220" y="300" width="520" height="180" rx="22" fill="url(#oliveVelvet)"/>
    
    <!-- Ribbed Vertical Channel Stitches -->
    <line x1="280" y1="300" x2="280" y2="480" stroke="#3B4E1A" stroke-width="2.5"/>
    <line x1="340" y1="300" x2="340" y2="480" stroke="#3B4E1A" stroke-width="2.5"/>
    <line x1="400" y1="300" x2="400" y2="480" stroke="#3B4E1A" stroke-width="2.5"/>
    <line x1="460" y1="300" x2="460" y2="480" stroke="#3B4E1A" stroke-width="2.5"/>
    <line x1="520" y1="300" x2="520" y2="480" stroke="#3B4E1A" stroke-width="2.5"/>
    <line x1="580" y1="300" x2="580" y2="480" stroke="#3B4E1A" stroke-width="2.5"/>
    <line x1="640" y1="300" x2="640" y2="480" stroke="#3B4E1A" stroke-width="2.5"/>

    <!-- 3 Back Cushions with Gold Horizontal Bands -->
    <!-- Cushion 1 -->
    <rect x="240" y="320" width="130" height="140" rx="14" fill="url(#oliveCushion)" stroke="#3B4E1A" stroke-width="1.5"/>
    <rect x="240" y="380" width="130" height="22" fill="url(#goldBand)"/>
    <!-- Cushion 2 -->
    <rect x="390" y="320" width="130" height="140" rx="14" fill="url(#oliveCushion)" stroke="#3B4E1A" stroke-width="1.5"/>
    <rect x="390" y="380" width="130" height="22" fill="url(#goldBand)"/>
    <!-- Cushion 3 -->
    <rect x="540" y="320" width="130" height="140" rx="14" fill="url(#oliveCushion)" stroke="#3B4E1A" stroke-width="1.5"/>
    <rect x="540" y="380" width="130" height="22" fill="url(#goldBand)"/>

    <!-- Main Seat Cushion Base -->
    <rect x="210" y="440" width="540" height="120" rx="16" fill="url(#oliveCushion)"/>

    <!-- Left Plush Rounded Armrest -->
    <rect x="170" y="380" width="70" height="170" rx="30" fill="url(#oliveVelvet)"/>
    <!-- Right Plush Rounded Armrest -->
    <rect x="710" y="380" width="70" height="170" rx="30" fill="url(#oliveVelvet)"/>
  </g>

  <!-- OLIVE GREEN SINGLE ARMCHAIR 1 (LEFT FOREGROUND) -->
  <g filter="url(#shadow2)">
    <ellipse cx="180" cy="710" rx="150" ry="22" fill="#000" opacity="0.25"/>
    <!-- Body -->
    <rect x="10" y="490" width="340" height="210" rx="28" fill="url(#oliveVelvet)"/>
    <!-- Seat Cushion -->
    <rect x="40" y="520" width="280" height="150" rx="20" fill="url(#oliveCushion)"/>
    <!-- Cushion with Gold Band -->
    <rect x="90" y="510" width="170" height="130" rx="16" fill="url(#oliveCushion)"/>
    <rect x="90" y="565" width="170" height="24" fill="url(#goldBand)"/>
    <!-- Left Curved Armrest -->
    <rect x="0" y="500" width="70" height="190" rx="32" fill="url(#oliveVelvet)"/>
  </g>

  <!-- OLIVE GREEN SINGLE ARMCHAIR 2 (RIGHT FOREGROUND) -->
  <g filter="url(#shadow2)">
    <ellipse cx="890" cy="680" rx="140" ry="20" fill="#000" opacity="0.22"/>
    <rect x="730" y="360" width="280" height="300" rx="28" fill="url(#oliveVelvet)"/>
    <rect x="760" y="410" width="220" height="220" rx="20" fill="url(#oliveCushion)"/>
    <!-- Back Cushion with Gold Band -->
    <rect x="780" y="380" width="180" height="150" rx="16" fill="url(#oliveCushion)"/>
    <rect x="780" y="440" width="180" height="24" fill="url(#goldBand)"/>
  </g>

  <!-- SQUARE GLASS-TOP COFFEE TABLE WITH PADDED BASE -->
  <g filter="url(#shadow2)">
    <ellipse cx="510" cy="740" rx="180" ry="28" fill="#000" opacity="0.3"/>

    <!-- Padded Base Box -->
    <rect x="360" y="530" width="300" height="180" rx="12" fill="url(#oliveVelvet)"/>

    <!-- Glass Top Surface -->
    <rect x="340" y="500" width="340" height="40" rx="6" fill="url(#glassReflect)" stroke="#A0C0B0" stroke-width="2"/>
    
    <!-- Water Bottles and Glasses on Tray -->
    <rect x="470" y="470" width="100" height="35" rx="4" fill="#FFFFFF" stroke="#DDD"/>
    <!-- Bottle 1 -->
    <rect x="485" y="410" width="18" height="60" rx="4" fill="#2C3A47"/>
    <rect x="489" y="400" width="10" height="10" fill="#C9A66B"/>
    <!-- Bottle 2 -->
    <rect x="510" y="410" width="18" height="60" rx="4" fill="#2C3A47"/>
    <rect x="514" y="400" width="10" height="10" fill="#C9A66B"/>
    <!-- Glass 1 -->
    <rect x="535" y="440" width="14" height="30" rx="2" fill="rgba(255,255,255,0.7)" stroke="#AAA"/>
    <!-- Glass 2 -->
    <rect x="552" y="440" width="14" height="30" rx="2" fill="rgba(255,255,255,0.7)" stroke="#AAA"/>
  </g>

  <!-- Title Badge Overlay -->
  <g>
    <rect x="30" y="30" width="480" height="52" rx="26" fill="rgba(10, 31, 23, 0.85)" stroke="#C9A66B" stroke-width="1.5"/>
    <text x="55" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="800" fill="#C9A66B">E2 HOMES RAIPUR</text>
    <text x="245" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">| Executive Olive Lounge</text>
  </g>
</svg>
